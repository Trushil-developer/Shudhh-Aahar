<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0A3B70"/>
<title>Shuddh Aahar | Everyday groceries delivered</title>
<meta name="description" content="Everyday essentials from your favourite UK supermarket, with full ingredients for every product. We shop for you and deliver. Pay on delivery."/>
<link rel="icon" type="image/png" href="/favicon-32.png"/>
<link rel="apple-touch-icon" href="/favicon-180.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#F7F8FA;--surface:#FFFFFF;--surface2:#F2F5F8;--border:#E4E8ED;--border2:#CDD5DE;
  --navy:#0A3B70;--accent:#0468C4;--accent-glow:rgba(4,104,196,0.09);
  --text:#111827;--text2:#4B5563;--muted:#6B7280;
  --safe:#0F8A4B;--safe-bg:#E9F7EF;
  --caution:#B45309;--caution-bg:#FEF3CD;
  --danger:#C53030;--danger-bg:#FDECEC;
  --info:#0468C4;--info-bg:#E7F1FB;
  --shadow-sm:0 1px 2px rgba(10,30,60,0.05),0 1px 1px rgba(10,30,60,0.04);
  --shadow-md:0 10px 30px rgba(6,43,87,0.10);
  --shadow-hover:0 6px 18px rgba(16,24,40,0.08);
  --radius:16px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,textarea{font-family:inherit;font-size:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* ── Header ── */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,0.92);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
.header-brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo-mark{width:34px;height:34px;border-radius:9px;display:block;object-fit:cover;box-shadow:0 3px 10px rgba(4,104,196,0.28)}
.logo-name{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-0.01em}
.logo-sub{font-size:9px;color:var(--accent);font-family:var(--mono);letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
.header-search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:0 12px;height:42px;min-width:0}
.header-search input{flex:1;border:0;background:transparent;outline:none;min-width:0;color:var(--text)}
.header-nav{display:flex;align-items:center;gap:6px;flex-shrink:0}
.nav-btn{position:relative;display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--text2);font-size:14px;font-weight:700;background:none;border:0;cursor:pointer}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{color:var(--navy);background:var(--accent-glow)}
.ico{width:20px;height:20px;flex-shrink:0;display:block}
.header-search .ico{color:var(--muted);width:18px;height:18px}
.badge{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;border-radius:99px;min-width:17px;height:17px;padding:0 5px;display:flex;align-items:center;justify-content:center}
@media (max-width:899px){
  .header-inner{flex-wrap:wrap}
  .header-search{order:3;flex-basis:100%}
  .logo-sub,.nav-label{display:none}
  .header-nav{margin-left:auto}
}
/* Tablets landscape / small laptops: icons-only top navigation */
@media (min-width:900px) and (max-width:1099px){
  .nav-label{display:none}
  .nav-btn{padding:9px 10px}
  .logo-sub{display:none}
}
/* Large monitors: use more of the screen */
@media (min-width:1400px){
  .wrap{max-width:1280px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .row{grid-auto-columns:minmax(180px,200px)}
}

main{min-height:70vh;padding:20px 0 48px}
h1{font-size:26px;font-weight:800;letter-spacing:-0.01em;margin:0 0 14px}
h2{font-size:19px;font-weight:800;margin:0}

/* ── Home: scan card, your items, history ── */
.scan-card{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff;border-radius:20px;padding:22px 24px;margin-bottom:28px;text-decoration:none;box-shadow:var(--shadow-md);transition:transform .15s}
.scan-card:hover{transform:translateY(-1px)}
.scan-card .big{width:60px;height:60px;border-radius:16px;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scan-card .big .ico{width:30px;height:30px}
.scan-card b{display:block;font-size:20px;font-weight:800}
.scan-card span{font-size:14px;color:rgba(255,255,255,0.88)}
.scan-card .go{margin-left:auto;background:#fff;color:var(--navy);border-radius:12px;padding:10px 18px;font-weight:800;font-size:15px;flex-shrink:0}
@media (max-width:560px){.scan-card{padding:18px;gap:14px}.scan-card .go{display:none}.scan-card b{font-size:18px}}
/* Home: "How to order" guide */
.howto{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px 22px;margin-bottom:28px;box-shadow:var(--shadow-md)}
.howto h2{margin:0 0 4px;font-size:20px}
.howto .lead{margin:0 0 16px;color:var(--text2);font-size:14px}
.howto-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.howto-btn{display:flex;align-items:center;gap:12px;border:0;border-radius:16px;padding:16px;font:inherit;text-align:left;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,var(--navy),var(--accent));color:#fff}
.howto-btn.alt{background:var(--accent-glow);color:var(--navy);border:2px solid var(--navy)}
.howto-btn .ico{width:28px;height:28px;flex-shrink:0}
.howto-btn b{display:block;font-size:16px;font-weight:800}
.howto-btn span{font-size:12.5px;opacity:.9}
#header-q.pulse{box-shadow:0 0 0 4px var(--accent-glow)}
.howto ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.howto li{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.howto li .n{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media (max-width:560px){.howto{padding:16px}.howto-actions{grid-template-columns:1fr}}
.section-head button.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;padding:0}
.home-empty{background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius);padding:20px;color:var(--text2);font-size:14px;text-align:center}
.pc-check{background:#fff;border-radius:14px;padding:14px;color:var(--text)}
.pc-check label{font-size:13px;font-weight:700}
.pc-row{display:flex;gap:8px;margin-top:8px}
.pc-row input{flex:1;min-width:0;border:1px solid var(--border2);border-radius:10px;padding:10px 12px;text-transform:uppercase;outline:none}
.pc-result{font-size:13px;font-weight:600;margin-top:8px;min-height:20px}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;margin-bottom:14px}
.notice.warn{background:var(--caution-bg);color:var(--caution)}
.notice.ok{background:var(--safe-bg);color:var(--safe)}
.notice.err{background:var(--danger-bg);color:var(--danger)}
.notice.info{background:var(--info-bg);color:var(--navy)}

/* ── Sections / grids ── */
.section{margin-bottom:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.section-head a{font-size:14px;font-weight:700;text-decoration:none}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,180px);gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:box-shadow .15s,border-color .15s,transform .15s}
.tile:hover{border-color:var(--border2);box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile-img{aspect-ratio:1/1;width:100%;display:flex;align-items:center;justify-content:center;margin-bottom:8px;background:#fff;border-radius:10px;padding:10px;overflow:hidden}
/* Product photos are volunteer phone shots, so present them as tidy packshots:
   same white square everywhere, centred, padded, never stretched. multiply +
   a small brightness lift blends off-white/grey photo backgrounds into the
   white tile. */
.pic{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;filter:brightness(1.06) contrast(1.04) saturate(1.05)}
.pic{opacity:0;transition:opacity .25s ease}
.pic.ok{opacity:1}
/* Shimmer in the photo spot until the photo has loaded */
.tile-img:has(> .pic:not(.ok)),.product-img:has(> .pic:not(.ok)),.thumb:has(> .pic:not(.ok)){background:linear-gradient(90deg,var(--surface2),#E9EDF2,var(--surface2));background-size:200% 100%;animation:shimmer 1.2s infinite}
@supports not selector(:has(*)){.pic{opacity:1}}
.ph{color:var(--border2)}
.ph .ico{width:40px;height:40px}
.tile-brand{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-name{font-size:14px;font-weight:600;line-height:1.3;min-height:36px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-size{font-size:12px;color:var(--muted);min-height:18px}
.tile-ing{font-size:12px;line-height:1.4;color:var(--text2);margin-top:6px;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-ing b{font-weight:600;color:var(--text)}
.tile-ing.none{color:var(--muted);font-style:italic}
.skel{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--surface2),#E9EDF2,var(--surface2));background-size:200% 100%;animation:shimmer 1.2s infinite;margin-top:6px}
.skel+.skel{width:70%}
@keyframes shimmer{to{background-position:-200% 0}}
.sk{background:linear-gradient(90deg,var(--surface2),#E9EDF2,var(--surface2));background-size:200% 100%;animation:shimmer 1.2s infinite}
.sk-tile{pointer-events:none}
.skel.sk-btn{height:36px;width:100%;border-radius:12px;margin-top:12px}
/* Price on its own line; below it a full-width Add button that turns into a
   full-width − qty + bar, so the control never overflows a narrow card. */
.tile-foot{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:auto;padding-top:8px}
.tile-foot .btn.small{width:100%;border-radius:10px;min-height:38px}
.tile-foot .stepper{width:100%;justify-content:space-between;border-radius:10px;height:38px}
.tile-foot .stepper button{width:44px;height:38px}
.tile-foot .stepper span{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
button.chip{cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.store-chips{flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0}
.store-chips .chip{padding:6px 11px;font-size:12px}
.chip{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text);text-decoration:none}

.btn{border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;font-size:15px;padding:13px 20px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{background:var(--border2);cursor:not-allowed}
.btn.small{font-size:13px;padding:7px 14px;border-radius:99px}
.btn.ghost{background:var(--surface);color:var(--navy);border:1px solid var(--border2)}
.btn.danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(197,48,48,0.3)}
.btn.safe{background:var(--safe)}
.btn.block{width:100%}
.stepper{display:inline-flex;align-items:center;background:var(--accent-glow);border-radius:99px;height:32px}
.stepper button{width:32px;height:32px;border:0;background:none;font-size:18px;font-weight:800;color:var(--navy);cursor:pointer}
.stepper span{min-width:20px;text-align:center;font-weight:800;color:var(--navy)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.section-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1.2px;font-family:var(--mono);margin-bottom:10px}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:860px){.two-col{grid-template-columns:1fr}}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.line:last-child{border-bottom:0}
.line .thumb{width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px}
.line-info{flex:1;min-width:0}
.line-name{font-weight:600;font-size:14px}
/* Basket: tap the photo or name to open the product */
.line-link{display:block;color:inherit;text-decoration:none;padding:2px 0}
.line-link:hover .line-name{text-decoration:underline}
.line-go{color:var(--muted);font-weight:700}
/* Product page: sold by only one of our supermarkets */
.only-at{display:inline-block;margin-top:14px;background:var(--caution-bg);color:var(--caution);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
a.thumb{text-decoration:none;cursor:pointer}
.line-meta{font-size:12px;color:var(--muted)}
.line-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sum-row{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:14px;color:var(--text2)}
.sum-row.total{font-size:18px;font-weight:800;color:var(--text);margin-top:4px}
.sum-row.strike span:first-child{text-decoration:line-through;color:var(--muted)}
.hint{font-size:12px;color:var(--text2);margin:6px 0}
.steps{margin:0;padding-left:18px;font-size:13px;color:var(--text2)}
.steps li{margin-bottom:4px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
input.f,textarea.f{width:100%;border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:#fff;color:var(--text);outline:none}
input.f:focus,textarea.f:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
input.f:disabled{background:var(--surface2);color:var(--text2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-msg{font-size:12px;font-weight:600;margin:-6px 0 10px}

.product{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
@media (max-width:720px){.product{grid-template-columns:1fr}}
.product-img{background:#fff;border:1px solid var(--border);border-radius:18px;aspect-ratio:1/1;max-height:420px;display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden}
.brand-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.crumbs a{color:var(--text2);text-decoration:none;font-weight:600}
.crumbs a:hover{color:var(--navy)}
.ing-text{font-size:14px;line-height:1.6;color:var(--text);margin:0}
.allergens{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.allergens .lbl{font-size:13px;font-weight:700;color:var(--text)}
.allergen{background:var(--caution-bg);color:var(--caution);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}

.status-pill{display:inline-block;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.st-PLACED{background:var(--caution-bg);color:var(--caution)}
.st-PRICED{background:var(--info-bg);color:var(--info)}
.st-APPROVED,.st-OUT_FOR_DELIVERY{background:var(--info-bg);color:var(--info)}
.st-DELIVERED{background:var(--safe-bg);color:var(--safe)}
.st-CANCELLED{background:var(--surface2);color:var(--muted)}
.order-card{display:block;text-decoration:none;color:inherit}
.order-card:hover{border-color:var(--border2)}
.step{display:flex;align-items:center;gap:12px;padding:6px 0;font-weight:600}
.dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;background:var(--border)}
.dot.done{background:var(--safe)}
.empty{text-align:center;padding:48px 16px;color:var(--text2)}
.empty .icon{width:64px;height:64px;border-radius:50%;background:var(--accent-glow);color:var(--navy);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty .icon .ico{width:28px;height:28px}
.empty h2{margin:0 0 6px;color:var(--text)}
.signin-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 16px;text-align:center}
.back{display:inline-block;margin-bottom:12px;font-weight:700;text-decoration:none;color:var(--navy)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Phone & tablet-portrait layout: bottom tab bar (≤899px) ── */
.tabbar{display:none}
@media (max-width:899px){
  .desk-only{display:none !important}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  header{padding-top:env(safe-area-inset-top)}
  .header-inner{gap:8px;padding-top:8px;padding-bottom:8px}
  .logo-mark{width:30px;height:30px}
  main{padding:14px 0 24px}
  h1{font-size:22px}
  /* iOS zooms into any field under 16px — keep every input at 16px */
  input,textarea,select{font-size:16px !important}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);
    border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;padding:4px 0;min-height:44px;justify-content:center}
  .tabbar a.active{color:var(--navy)}
  .tabbar .ti{position:relative;line-height:1}
  .tabbar .ico{width:22px;height:22px}
  .tabbar .badge{top:-6px;right:-12px}
  .tab-scan .ti{background:var(--navy);color:#fff;border-radius:14px;padding:8px 12px;margin-top:-16px;box-shadow:var(--shadow-md)}
  .search-scan span{display:none}
  footer{padding-bottom:calc(22px + 64px + env(safe-area-inset-bottom));margin-bottom:calc(-64px - env(safe-area-inset-bottom))}
}
/* Tablet portrait: phone navigation, but roomier content */
@media (min-width:721px) and (max-width:899px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row{grid-auto-columns:minmax(170px,31%)}
}
/* Phones: compact */
@media (max-width:720px){
  .welcome{gap:12px;margin-bottom:10px}
  .welcome .pc-check{max-width:none}
  .pc-check{padding:10px}
  .pc-row input{padding:9px 10px}
  .notice{font-size:13px;padding:10px 12px}
  .section{margin-bottom:20px}
  .row{grid-auto-columns:minmax(150px,46%)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:10px}
  .tile-name{font-size:13px}
  .card{padding:14px;border-radius:14px}
  /* bigger tap targets (Apple's minimum is 44px) */
  .stepper{height:40px}
  .stepper button{width:40px;height:40px;font-size:20px}
  .btn.small{min-height:38px;padding:8px 14px}
  .btn{min-height:46px}
  .product{gap:16px}
  .product-img{padding:18px;max-height:340px}
  .two-col{gap:12px}
  .modes .mode{padding:12px 10px}
}
footer{border-top:1px solid var(--border);padding:22px 0;font-size:12px;color:var(--muted);background:var(--surface)}
footer p{margin:4px 0}
footer a{color:var(--text2);text-decoration:none}

<script>
// Shuddh Aahar web shop. There's no product list of our own: customers
// search every UK grocery live (via our shop-info endpoint, catalog-get.js,
// which proxies Open Food Facts), order anything, and we price each item
// after we've shopped. There's no approval step: we deliver within 24 hours,
// every day 5pm–8pm, and the customer pays the shop prices on delivery.
// Orders go through AppSync (shop-actions.js); signing in uses
// Google Identity Services. Money is integer pence throughout.
const SHOP = {
  infoUrl: 'https://v36cyuprlc.execute-api.eu-west-2.amazonaws.com',   // terraform output catalog_url
  appsyncEndpoint: 'https://mt6klwidgjfqbkn3pun4bu4lv4.appsync-api.eu-west-2.amazonaws.com/graphql',
  googleClientId: '592286927972-ponp7dqv3j5dkg98filk8me2jef05a8n.apps.googleusercontent.com',
};

const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  scan: '<path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/>',
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/>',
  store: '<path d="M4 9h16l-1.2-4.2A1 1 0 0 0 17.8 4H6.2a1 1 0 0 0-1 .8z"/><path d="M5 9v11h14V9M9 20v-6h6v6"/>',
  basket: '<path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  truck: '<path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',
  pound: '<path d="M17 6.5A4 4 0 0 0 9.5 8v9.5M6 12h8M6 18h11"/>',
  leaf: '<path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19 13 11"/>',
  box: '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
  pin: '<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r=".8"/>',
  star: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
};
const ICONS_PH = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">' + '<path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6"/></svg>';
function icon(n) { return `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`; }

// ─── State ───────────────────────────────────────────────────────
let SETTINGS = null;              // { shopOpen, deliveryFeePence, radiusMiles, areaName, deliveryConfigured }
let HISTORY = load('shop_history', []); // products the customer scanned or opened, newest first (this device only)
const INGREDIENTS = new Map();    // barcode → 'loading' | { ingredients: string|null, allergens: [] }
const SEARCHES = new Map();       // query → { products, page, pages, total, loading, error }
const PRODUCTS = new Map();       // barcode → product (from search results or product lookups)
let CART = load('shop_cart_v2', {});   // barcode → { qty, name, brand, image, quantity }
let MY_ITEMS = load('shop_my_items', []); // products the customer pinned to their home screen (kept on their account when signed in)
let STORE_ID = load('shop_store', null);   // the customer's supermarket (this device only — never stored on our side)
let MODE = load('shop_mode', 'SHOP_AROUND'); // basket choice: 'STORE' (buy at their supermarket) or 'SHOP_AROUND'
// Prices (TESTING): the chosen supermarket's shelf price from Trolley.co.uk,
// looked up per product + pack size by catalog-get.js (?price=). Only shown on
// the product page, basket and checkout — never on home/search tiles — and
// always as an estimate: we confirm the exact price before the customer pays.
const PRICES = new Map();         // `${store}|${barcode}|${size}` → 'loading' | { storePence|null, sizes, offer, loyaltyPence, loyaltyLabel }
const SIZE_PICK = new Map();      // barcode → pack size the customer picked on the product page
let SESSION = load('shop_session', null);
let ORDERS_CACHE = null;
let afterSignIn = null;

function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function store(key, value) { try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(value)); } catch {} }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function gbp(p) { return '£' + ((p || 0) / 100).toFixed(2); }
function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }
const $view = document.getElementById('view');

// Customers never see which supermarket an own-brand product comes from —
// we choose where to buy. The full name is still sent with the order, so the
// admin knows exactly what to buy.
const STORE_NAMES = ["sainsbury's", 'sainsburys', 'sainsbury', 'tesco', 'asda', 'morrisons', 'aldi', 'lidl', 'waitrose & partners', 'waitrose',
  'the co-operative', 'the co-op', 'co-operative', 'cooperative', 'co-op', 'coop', 'marks & spencer', 'marks and spencer', 'm&s', 'iceland', 'ocado', 'booths', 'spar',
  'costco', 'farmfoods', 'budgens', 'londis', 'nisa', 'heron foods', 'b&m', 'poundland'];
const STORE_RE = new RegExp('(^|[^a-z])(by\\s+)?(' + STORE_NAMES.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace("'", "['’]?")).join('|') + ')(?=$|[^a-z])', 'gi');
function cleanBrand(brand) {
  const b = String(brand || '').trim();
  return !b || b.replace(STORE_RE, ' ').replace(/[\s,.\-&]+/g, '') === '' ? '' : b.replace(STORE_RE, '$1').replace(/\s{2,}/g, ' ').trim();
}
function cleanName(name) {
  const n = String(name || '').replace(STORE_RE, '$1').replace(/\s{2,}/g, ' ').replace(/^[\s\-–,.:]+|[\s\-–,.:]+$/g, '').trim();
  return n ? n.charAt(0).toUpperCase() + n.slice(1) : String(name || '');
}
function title(p) { return [cleanBrand(p.brand), cleanName(p.name)].filter(Boolean).join(' '); }

// ─── Supermarket choice & prices ─────────────────────────────────
function stores() { return (SETTINGS && SETTINGS.stores) || []; }
// Our supermarkets' names, for before the shop settings have loaded.
const STORE_DISPLAY_NAMES = { tesco: 'Tesco', sainsburys: "Sainsbury's", asda: 'Asda', morrisons: 'Morrisons', aldi: 'Aldi', lidl: 'Lidl', waitrose: 'Waitrose', ms: 'Marks & Spencer' };
function storeName(id = STORE_ID) { const s = stores().find(x => x.id === id); return s ? s.name : STORE_DISPLAY_NAMES[id] || 'your supermarket'; }
function applyStore(id) {
  const changed = id !== STORE_ID;
  STORE_ID = id; store('shop_store', id);
  updateStoreLabel();
  if (changed) {
    SEARCHES.clear(); PRODUCTS.clear();
    refreshCartPrices();
  }
}
function chooseStore(id) {
  applyStore(id);
  if (signedIn()) saveStoreToAccount(id).catch(err => console.warn('Could not save supermarket to account', err));
  location.hash = '#/';
}
// Basket: pick the supermarket to buy everything at, without leaving the basket.
function basketStore(id) {
  MODE = 'STORE'; store('shop_mode', MODE);
  applyStore(id);
  if (signedIn()) saveStoreToAccount(id).catch(err => console.warn('Could not save supermarket to account', err));
  render();
}
function updateStoreLabel() {
  const label = STORE_ID ? storeName() : 'Store';
  document.getElementById('store-label').textContent = label;
  document.getElementById('store-label-m').textContent = label.length > 9 ? label.split(/[\s']/)[0] : label;
}
// ─── Prices (product page + basket only) ─────────────────────────
const priceQueue = [];
let priceActive = 0;
function priceKey(p) { return `${STORE_ID}|${p.barcode}|${p.quantity || ''}`; }
// Current price state for a product at a pack size; starts a lookup if needed.
function priceFor(p) {
  const key = priceKey(p);
  if (!PRICES.has(key)) { PRICES.set(key, 'loading'); priceQueue.push({ key, p }); pumpPrices(); }
  return PRICES.get(key);
}
function pumpPrices() {
  while (priceActive < 3 && priceQueue.length) {
    const { key, p } = priceQueue.shift();
    priceActive++;
    info({ price: p.barcode, name: p.name || '', brand: p.brand || '', quantity: p.quantity || '' })
      .catch(() => ({ storePence: null, sizes: [], unavailable: true }))
      .then(r => { PRICES.set(key, r); notePhoto(p.barcode, r); priceActive--; pumpPrices(); priceChanged(); });
  }
}
// Re-render once a batch of prices lands — but never under a form being filled in.
let priceRenderTimer = null;
function priceChanged() {
  clearTimeout(priceRenderTimer);
  priceRenderTimer = setTimeout(() => { if (!location.hash.startsWith('#/checkout')) render(); }, 120);
}
// Price for a line in a basket mode: the chosen store's shelf price, or — when
// shopping around — the cheapest of our supermarkets (and which one).
function modePrice(r, mode = MODE) {
  if (!r || r === 'loading') return null;
  return mode === 'SHOP_AROUND' ? (r.cheapest ? r.cheapest.pence : null) : r.storePence;
}
function unitPrice(l, mode = MODE) { return modePrice(priceFor(l), mode); }
function buyFrom(l) { const r = priceFor(l); return r && r !== 'loading' && r.cheapest ? r.cheapest.storeName : null; }
// 'loading' | 'ok' (priced) | 'none' (not sold — we can't deliver it) | 'failed' (lookup error, retryable)
function priceState(r, mode = MODE) { return !r || r === 'loading' ? 'loading' : modePrice(r, mode) ? 'ok' : r.unavailable ? 'failed' : 'none'; }
function priceReady(p) {
  return new Promise(resolve => { const tick = () => { const r = priceFor(p); if (r !== 'loading') resolve(r); else setTimeout(tick, 150); }; tick(); });
}
function retryPrices() { for (const [k, r] of PRICES) if (priceState(r) === 'failed') PRICES.delete(k); render(); }
let toastTimer = null;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3500);
}
function priceTag(pence) { return pence ? `<span class="price">${gbp(pence)}</span><span class="est">est.</span>` : ''; }
function linePrice(l) {
  const r = priceFor(l), st = priceState(r);
  if (st === 'loading') return '<span class="hint" style="margin:0">Checking price…</span>';
  if (st === 'ok') return gbp(unitPrice(l) * l.qty) + (MODE === 'SHOP_AROUND' ? ` <span class="hint" style="margin:0;font-weight:600">· from ${esc(buyFrom(l))}</span>` : '');
  if (st === 'failed') return `<span class="hint" style="margin:0">Couldn't check the price · <a href="javascript:retryPrices()">Try again</a></span>`;
  // Buying at one store, but another of ours sells it: say so, not "can't deliver".
  if (MODE === 'STORE' && r.cheapest) return `<span class="cant">${esc(storeName())} doesn't sell this</span> · <a href="javascript:void 0" onclick="setMode('SHOP_AROUND')">Switch to Best price</a> · <a href="javascript:void 0" onclick="setQty(${esc(JSON.stringify(l.barcode))},0)">Remove</a>`;
  return `<span class="cant">Sorry, we can't deliver this item</span> · <a href="javascript:void 0" onclick="setQty(${esc(JSON.stringify(l.barcode))},0)">Remove</a>`;
}
// Checkout needs every line priced: nothing we can't deliver, nothing still loading.
function basketBlocker() {
  const states = cartLines().map(l => priceState(priceFor(l)));
  if (states.includes('none')) {
    const elsewhere = MODE === 'STORE' && cartLines().some(l => { const r = priceFor(l); return priceState(r) === 'none' && r.cheapest; });
    return elsewhere ? `${storeName()} doesn't sell some of your items (marked in red). Choose a different supermarket, switch to Best price, or remove them.` : "Remove the items we can't deliver to continue.";
  }
  if (states.includes('failed')) return "We couldn't check some prices — tap Try again.";
  if (states.includes('loading')) return 'Checking prices…';
  return '';
}
function basketTotals(mode = MODE) {
  const lines = cartLines();
  const subtotal = lines.reduce((s, l) => s + (unitPrice(l, mode) || 0) * l.qty, 0);
  const fee = SETTINGS ? SETTINGS.deliveryFeePence : 300;
  const freeOver = SETTINGS ? SETTINGS.freeDeliveryOverPence : 3000;
  const delivery = lines.length && !(freeOver > 0 && subtotal >= freeOver) ? fee : 0;
  const unpriced = lines.filter(l => !unitPrice(l, mode)).length;
  return { subtotal, delivery, total: subtotal + delivery, freeOver, toFree: freeOver > 0 ? Math.max(0, freeOver - subtotal) : 0, unpriced };
}
// Prices are keyed by store, so a store change just needs a redraw.
function refreshCartPrices() { render(); }

// ─── "Your items" on the home screen ─────────────────────────────
function isMyItem(barcode) { return MY_ITEMS.some(i => i.barcode === barcode); }
function toggleMyItem(barcode) {
  if (isMyItem(barcode)) MY_ITEMS = MY_ITEMS.filter(i => i.barcode !== barcode);
  else {
    const p = PRODUCTS.get(barcode);
    if (!p) return;
    MY_ITEMS = [{ barcode, name: p.name, brand: p.brand, image: p.image, quantity: p.quantity }, ...MY_ITEMS].slice(0, 40);
  }
  store('shop_my_items', MY_ITEMS);
  saveListsSoon();
  render();
}

// Retries briefly when the server is busy (429/5xx or a dropped connection),
// so a moment of heavy traffic doesn't show the customer an error.
async function info(params) {
  const url = `${SHOP.infoUrl}/?${new URLSearchParams({ ...params, ...(STORE_ID ? { store: STORE_ID } : {}) })}`;
  let lastError;
  for (const wait of [0, 600, 1500, 3000]) {
    if (wait) await new Promise(r => setTimeout(r, wait));
    try {

    <p class="hint" style="margin-bottom:16px">We'll show you that shop's products and prices, and buy your order there for you. At the basket you can also choose “Best price”, and we'll buy each item wherever it's cheapest. You can change your supermarket any time.</p>
    <div class="store-grid">${stores().map(st => `<button class="store-btn ${st.id === STORE_ID ? 'active' : ''}" onclick="chooseStore('${esc(st.id)}')">${esc(st.name)}</button>`).join('')}</div>
    ${signedIn() ? '<p class="hint" style="margin-top:14px">Saved to your account — it’ll be ready on any device you sign in on.</p>'
      : `<div class="card signin-box" style="margin-top:18px"><b>Already chose a supermarket on another device?</b><span class="hint" style="margin:0">Sign in and we'll load it for you.</span><div id="gbtn"></div></div>`}`;
}
function closedNotice() { return SETTINGS && SETTINGS.shopOpen === false ? `<div class="notice warn">We're not taking orders right now. You can still browse and fill your basket.</div>` : ''; }
const STATUS_LABEL = { PLACED: 'Order placed', PRICED: 'Shopped', APPROVED: 'Shopped', OUT_FOR_DELIVERY: 'Out for delivery', DELIVERED: 'Delivered', CANCELLED: 'Cancelled' };
function statusPill(s) { return `<span class="status-pill st-${esc(s)}">${STATUS_LABEL[s] || esc(s)}</span>`; }
function signInPrompt(title, text) {
  return `<div class="card signin-box"><div class="empty" style="padding:0"><div class="icon" style="margin:0">${icon('user')}</div></div><h2>${title}</h2><p style="margin:0;color:var(--text2)">${text}</p><div id="gbtn"></div></div>`;
}

// ─── Views ───────────────────────────────────────────────────────
function viewHome() {
  if (!STORE_ID) { afterSignIn = '#/'; return viewStore(); }
  if (!SETTINGS) loadSettings();
  remember(MY_ITEMS);
  remember(HISTORY);
  // How to order: people weren't sure whether to type or scan, so say it
  // plainly and give both as big buttons.
  const scan = `
    <section class="howto" aria-labelledby="howto-title">
      <h2 id="howto-title">How to order</h2>
      <p class="lead">Find the groceries you want — type the name or scan the barcode on the pack.</p>
      <div class="howto-actions">
        <button class="howto-btn" type="button" onclick="focusSearch()"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span><b>Type to search</b><span>e.g. milk, atta, Heinz beans</span></span></button>
        <a class="howto-btn alt" href="#/scan">${icon('scan')}<span><b>Scan a barcode</b><span>Use your phone camera</span></span></a>
      </div>
      <ol>
        <li><span class="n">1</span><span><b>Find a product</b> — type in the search bar at the top, or scan its barcode.</span></li>
        <li><span class="n">2</span><span><b>Tap Add</b> to put it in your basket.</span></li>
        <li><span class="n">3</span><span><b>Open Basket and check out.</b> ${DELIVERY_PROMISE}, ${DELIVERY_SLOT} — pay on delivery.</span></li>
      </ol>
    </section>`;
  const mine = `
    <section class="section">
      <div class="section-head"><h2>Your items</h2></div>
      ${MY_ITEMS.length ? `<div class="grid">${MY_ITEMS.map(tile).join('')}</div>`
        : `<div class="home-empty">Nothing here yet. Open a product and choose “Add to my home screen” to keep it here.</div>`}
    </section>`;
  const history = `
    <section class="section">
      <div class="section-head"><h2>History</h2>${HISTORY.length ? '<button class="link" type="button" onclick="clearHistory()">Clear</button>' : ''}</div>
      ${HISTORY.length ? `<div class="grid">${HISTORY.map(tile).join('')}</div>`
        : `<div class="home-empty">Products you scan or open will appear here.</div>`}
    </section>`;
  return deliveryNotice() + scan + mine + history;
}

function viewSearch(params) {
  if (!STORE_ID) return viewStore();
  const q = (params.get('q') || '').trim();
  if (!q) return `<h1>Search</h1><div class="empty"><div class="icon">${icon('search')}</div><p>Search any UK grocery, for example “milk”, “atta” or “Heinz beans”.</p></div>`;
  const s = SEARCHES.get(q.toLowerCase());
  if (!s || (!s.products && !s.error)) { runSearch(q); return `<h1>Results for “${esc(q)}” at ${esc(storeName())}</h1><p class="hint">Finding products ${esc(storeName())} sells…</p>${skeletonTiles(8)}`; }
  if (s.error && !s.products) return `<h1>Results for “${esc(q)}” at ${esc(storeName())}</h1><div class="notice err">${esc(s.error)}</div><button class="btn" onclick="SEARCHES.delete('${esc(q.toLowerCase())}');render()">Try again</button>`;
  return `
    <h1>Results for “${esc(q)}” at ${esc(storeName())}</h1>
    ${s.products.length
      ? `<p class="hint">${s.total > s.products.length ? `Showing ${s.products.length} of ${s.total.toLocaleString()}` : plural(s.products.length, 'product', 'products')} · you pay shop prices on delivery</p>
         <div class="grid">${s.products.map(tile).join('')}</div>
         ${s.page < s.pages ? `<div style="text-align:center;margin-top:18px"><button class="btn ghost" ${s.loading ? 'disabled' : ''} onclick="runSearch(${esc(JSON.stringify(q))}, true)">${s.loading ? 'Loading…' : 'Load more'}</button></div>` : ''}`
      : `<div class="empty"><div class="icon">${icon('search')}</div><p>Nothing found at ${esc(storeName())}. Try a shorter or different word, or <a href="#/store">pick another supermarket</a>.</p></div>`}`;
}

function viewProduct(barcode) {
  let p = PRODUCTS.get(barcode);
  if (!p || !p.full) { if (!p || !p.loading) { PRODUCTS.set(barcode, { ...(p || {}), barcode, loading: true }); loadProduct(barcode); } if (!p || !p.name) return skeletonProduct(); }
  p = PRODUCTS.get(barcode);
  if (!p.missing) addHistory(p);
  if (p.missing) return `<a class="back" href="#/">‹ Back to home</a><div class="empty"><div class="icon">${icon('scan')}</div><h2>We couldn’t find barcode ${esc(barcode)}</h2><p>It isn’t in the UK product database yet. Try <a href="#/scan">scanning again</a> or search for it by name.</p></div>`;
  const base = priceFor(p);
  const ready = base && base !== 'loading';
  const chosen = (CART[barcode] && CART[barcode].quantity) || SIZE_PICK.get(barcode) || '';
  const picked = chosen && chosen !== p.quantity ? priceFor({ ...p, quantity: chosen }) : base;
  const pickedReady = picked && picked !== 'loading';
  // No size picked yet: show the size Trolley priced (may be the nearest one).
  const size = chosen || (pickedReady && picked.matchedSize) || p.quantity || '';
  const sizes = ready ? [...(base.sizes || [])] : [];
  if (size && pickedReady && picked.storePence && !picked.approximate && !sizes.includes(size)) sizes.unshift(size);
  const q = (CART[barcode] && CART[barcode].qty) || 0;
  const priceRow = !pickedReady ? '<span class="hint" style="margin:0">Checking price…</span>'
    : picked.storePence ? priceTag(picked.storePence)
    : picked.unavailable ? `<span class="hint" style="margin:0">Couldn't check</span>`
    : `<span class="cant">${picked.cheapest ? 'Not sold here' : 'Unavailable'}</span>`;
  const st = priceState(picked);
  const cheap = pickedReady && picked.cheapest;
  // Not at their store, but another supermarket sells it: they can still buy it by shopping around.
  const aroundOnly = MODE === 'STORE' && st === 'none' && cheap;
  // Which of our supermarkets sell it — call out products only one of them sells.
  const soldAt = pickedReady && Array.isArray(picked.soldAt) ? picked.soldAt : [];
  const names = (ids) => ids.map(id => storeName(id));
  const listNames = (ids) => { const n = names(ids); return n.length > 1 ? `${n.slice(0, -1).join(', ')} and ${n[n.length - 1]}` : n[0] || ''; };
  const availability = soldAt.length === 1
    ? `<div class="only-at">🏪 Only available at <b>${esc(storeName(soldAt[0]))}</b>${soldAt[0] !== STORE_ID ? ` — not at ${esc(storeName())}` : ''}</div>`
    : soldAt.length > 1 ? `<p class="hint" style="margin:10px 0 0">Sold at ${esc(listNames(soldAt))}</p>` : '';
  const ing = ingredientsOf(p);
  const ingCard = `
        <div class="card" style="margin-top:16px">
          <div class="section-label">INGREDIENTS</div>
          ${!ing || ing === 'loading' ? '<span class="skel"></span><span class="skel"></span>'
            : ing.ingredients ? `<p class="ing-text">${esc(ing.ingredients)}</p>`
            : '<p class="ing-text" style="color:var(--muted)">The ingredients for this product haven’t been listed yet. Please check the pack.</p>'}
          ${ing && ing !== 'loading' && ing.allergens.length ? `<div class="allergens"><span class="lbl">Contains:</span>${ing.allergens.map(a => `<span class="allergen">${esc(a)}</span>`).join('')}</div>` : ''}
          <p class="hint" style="margin:12px 0 0">Recipes change, so always check the pack, especially if you have an allergy.</p>
        </div>`;
  return `
    <nav class="crumbs" aria-label="Breadcrumb"><a href="javascript:history.back()">‹ Back</a><span>·</span><a href="#/">Home</a><span>/</span><span>${esc(cleanName(p.name))}</span></nav>
    <div class="product">
      <div class="product-img">${img(p)}</div>
      <div>
        ${cleanBrand(p.brand) ? `<div class="brand-label">${esc(cleanBrand(p.brand).toUpperCase())}</div>` : ''}
        <h1 style="margin:4px 0">${esc(cleanName(p.name))}</h1>
        ${p.quantity && !sizes.length ? `<div style="color:var(--text2)">${esc(p.quantity)}</div>` : ''}
        ${sizes.length ? `<div class="section-label" style="margin-top:14px">SIZE</div>
          <div class="chips" style="flex-wrap:wrap;margin-bottom:0">${sizes.map(sz => `<button type="button" class="chip${sz === size ? ' active' : ''}" onclick="pickSize(${esc(JSON.stringify(barcode))},${esc(JSON.stringify(sz))})">${esc(sz)}</button>`).join('')}</div>` : ''}
        ${availability}
        <div class="card" style="margin:16px 0">
          <div class="sum-row" style="font-size:15px"><span>At ${esc(storeName())}${size ? ` · ${esc(size)}` : ''}</span><span>${priceRow}</span></div>
          ${picked && picked.loyaltyPence ? `<div class="sum-row" style="font-size:14px;color:var(--text2)"><span>${esc(picked.loyaltyLabel)}</span><span>${gbp(picked.loyaltyPence)}</span></div>` : ''}
          ${picked && picked.offer && !picked.loyaltyPence ? `<p class="hint" style="margin:4px 0 0">Offer: ${esc(picked.offer)}</p>` : ''}
          ${cheap && cheap.storeId !== STORE_ID ? `<div class="sum-row" style="font-size:15px;color:var(--text)"><span><b>Cheapest</b> · ${esc(cheap.storeName)}</span><span>${priceTag(cheap.pence)}</span></div>
            ${picked.storePence > cheap.pence ? `<div class="save">Save ${gbp(picked.storePence - cheap.pence)} with Best price</div>` : ''}` : ''}
          ${pickedReady && picked.approximate ? `<p class="hint" style="margin:6px 0 0">Closest match${picked.storePence ? ` at ${esc(storeName())}` : ''}: <b>${esc(picked.matchedName)}</b></p>` : ''}
          ${pickedReady && (picked.storePence || cheap) && !aroundOnly ? `<p class="hint">Supermarket shelf price. You pay the price we pay in store, on delivery.</p>`
            : aroundOnly ? `<p class="hint">${esc(storeName())} doesn't sell this, but ${esc(cheap.storeName)} does. Switch your basket to “Best price” and we'll buy it there for you.</p>`
            : st === 'failed' ? `<p class="hint">We couldn't check the price just now. <a href="javascript:retryPrices()">Try again</a></p>`
            : st === 'none' ? `<p class="hint">Sorry, we can't deliver this item — none of the supermarkets we shop at stocks it.${sizes.length > 1 ? ' Try another size.' : ''}</p>` : ''}
        </div>
        ${q && st === 'none' ? `<button class="btn ghost" onclick="setQty(${esc(JSON.stringify(barcode))},0)">Remove from basket</button>`
          : q ? `<div style="display:flex;gap:12px;align-items:center">${stepper(barcode, q)}<a class="btn" href="#/basket">View basket</a></div>`
          : st === 'ok' ? `<button class="btn" ${ADDING.has(barcode) ? 'disabled' : ''} onclick="addToCart(${esc(JSON.stringify(barcode))})">Add to basket</button>`
          : aroundOnly ? `<button class="btn" onclick="MODE='SHOP_AROUND';store('shop_mode',MODE);addToCart(${esc(JSON.stringify(barcode))})">Switch to Best price &amp; add to basket</button>`
          : `<button class="btn" disabled style="background:var(--border2)">${st === 'loading' ? 'Checking price…' : "Can't deliver this item"}</button>`}
        <div style="margin-top:12px"><button class="btn ghost" onclick="toggleMyItem('${esc(barcode)}')">${isMyItem(barcode) ? '✓ On your home screen · Remove' : `${icon('star')} Add to my home screen`}</button></div>
        ${ingCard}
        <p class="hint" style="margin-top:14px">Barcode ${esc(barcode)}</p>
      </div>
    </div>`;
}

// Picking a size also switches the basket line, if the product is in it.
function pickSize(barcode, size) {
  SIZE_PICK.set(barcode, size);
  if (CART[barcode]) { CART[barcode].quantity = size; store('shop_cart_v2', CART); saveListsSoon(); }
  render();
}
function setMode(m) { MODE = m; store('shop_mode', m); render(); }
function modeChooser() {
  const atStore = basketTotals('STORE'), around = basketTotals('SHOP_AROUND');
  const saving = atStore.unpriced || around.unpriced ? 0 : atStore.subtotal - around.subtotal;
  const store = esc(storeName());
  const storeMissing = atStore.unpriced
    ? `<span class="hint cant" style="display:block;margin:6px 0 0">${store} doesn't sell ${plural(atStore.unpriced, 'of your items', 'of your items')} (marked in red in your basket). Choose a different supermarket below, switch to Best price, or remove ${atStore.unpriced === 1 ? 'it' : 'them'}.</span>` : '';
  const aroundMissing = around.unpriced
    ? `<span class="hint cant" style="display:block;margin:6px 0 0">${plural(around.unpriced, 'item isn’t', 'items aren’t')} sold at any supermarket we shop at — please remove ${around.unpriced === 1 ? 'it' : 'them'}.</span>` : '';
  return `<div class="modes">
    <label class="mode ${MODE === 'STORE' ? 'active' : ''}"><input type="radio" name="mode" ${MODE === 'STORE' ? 'checked' : ''} onchange="setMode('STORE')"/>
      <span><b>Buy everything from ${store}${atStore.subtotal ? ` · ${gbp(atStore.subtotal)}` : ''}</b><span class="hint">We go to ${store}, buy all your items there at ${store}'s prices, and deliver them to you.</span>${storeMissing}
        <span class="hint" style="display:block;margin:10px 0 0;font-weight:600">Want a different supermarket?</span>
        <span class="chips store-chips" style="margin-top:6px">${stores().map(st => `<button type="button" class="chip${st.id === STORE_ID ? ' active' : ''}" onclick="event.preventDefault();basketStore('${esc(st.id)}')">${esc(st.name)}</button>`).join('')}</span></span></label>
    <label class="mode ${MODE === 'SHOP_AROUND' ? 'active' : ''}"><input type="radio" name="mode" ${MODE === 'SHOP_AROUND' ? 'checked' : ''} onchange="setMode('SHOP_AROUND')"/>
      <span><b>Best price${around.subtotal ? ` · ${gbp(around.subtotal)}` : ''}</b><span class="hint">We check all the supermarkets, buy each item wherever it's cheapest, and deliver everything to you together.</span>${saving > 0 ? `<span class="save">You save ${gbp(saving)} compared with buying everything from ${store}</span>` : ''}${aroundMissing}</span></label>
  </div>`;
}
// Shop around: which supermarket each item comes from, cheapest first.
function whereWeBuy() {
  if (MODE !== 'SHOP_AROUND') return '';
  const groups = new Map();
  for (const l of cartLines()) {
    const at = unitPrice(l) && buyFrom(l);
    if (!at) continue;
    const g = groups.get(at) || { items: [], total: 0 };
    g.items.push(l); g.total += unitPrice(l) * l.qty;
    groups.set(at, g);
  }
  if (!groups.size) return '';
  return `<div class="section-label" style="margin-top:14px">WHERE WE'LL BUY</div>
    ${[...groups].map(([store, g]) => `
      <div class="sum-row" style="font-weight:700"><span>${esc(store)} · ${plural(g.items.reduce((n, l) => n + l.qty, 0), 'item', 'items')}</span><span>${gbp(g.total)}</span></div>
      <div class="hint" style="margin:0 0 8px">${g.items.map(l => esc(`${l.qty} × ${cleanName(l.name)}`)).join(', ')}</div>`).join('')}`;
}
function basketSummary() {
  const t = basketTotals();
  return `
    <div class="sum-row"><span>Items (${cartCount()})</span><span>${gbp(t.subtotal)}</span></div>
    <div class="sum-row"><span>Delivery</span><span>${t.delivery ? gbp(t.delivery) : 'Free'}</span></div>
    <div class="sum-row total"><span>Estimated total</span><span>${gbp(t.total)}</span></div>
    ${t.delivery && t.toFree ? `<p class="hint">Add ${gbp(t.toFree)} more for free delivery.</p>` : ''}
    ${whereWeBuy()}
    <p class="hint">Estimated from ${MODE === 'SHOP_AROUND' ? 'supermarket' : esc(storeName()) + "'s"} shelf prices. You pay the prices we pay in store, on delivery, by cash or card.</p>
    ${deliveryNotice()}`;
}
function viewBasket() {
  if (!STORE_ID) return viewStore();
  const lines = cartLines();
  if (!lines.length) return `<h1>Basket</h1><div class="empty"><div class="icon">${icon('basket')}</div><h2>Your basket is empty</h2><p>Search for anything you'd buy at a UK supermarket.</p><a class="btn" href="#/">Start shopping</a></div>`;
  const fee = SETTINGS ? SETTINGS.deliveryFeePence : 0;
  return `
    <h1>Basket</h1>
    <div class="two-col">
      <div class="card">${lines.map(l => `
        <div class="line">
          <a class="thumb" href="#/product/${encodeURIComponent(l.barcode)}" aria-label="Open ${esc(cleanName(l.name))}">${img(l)}</a>
          <div class="line-info">
            <a class="line-link" href="#/product/${encodeURIComponent(l.barcode)}">
              <div class="line-name">${esc(cleanName(l.name))} <span class="line-go" aria-hidden="true">›</span></div>
              <div class="line-meta">${esc([cleanBrand(l.brand), l.quantity].filter(Boolean).join(' · '))}</div>
            </a>
            <div class="line-meta" style="font-weight:700;color:var(--text)">${linePrice(l)}</div>

      <div class="card">
        <div class="section-label">HOW SHOULD WE BUY YOUR ITEMS?</div>
        ${modeChooser()}
        ${basketSummary()}
        ${SETTINGS && SETTINGS.shopOpen === false ? `<p class="hint" style="color:var(--caution);font-weight:600">We're not taking orders right now.</p>` : ''}
        ${basketBlocker() ? `<p class="hint" style="color:var(--danger);font-weight:600">${esc(basketBlocker())}</p>` : ''}
        <a class="btn block" style="margin-top:10px${(SETTINGS && SETTINGS.shopOpen === false) || basketBlocker() ? ';pointer-events:none;background:var(--border2)' : ''}" href="#/checkout">Checkout</a>
      </div>

}

const EMPTY_ADDRESS = { fullName: '', line1: '', line2: '', city: '', postcode: '', phone: '' };
let checkoutPostcode = null; // { postcode, town, deliverable } once checked
let editingAddress = false;
// The customer's address lives on this device (and on their past orders) —

            <label class="f" for="line2">Flat, building (optional)</label><input class="f" id="line2" autocomplete="address-line2" value="${esc(a.line2 || '')}"/>
            <label class="f" for="city">Town</label><input class="f" id="city" required autocomplete="address-level2" value="${esc((checkoutPostcode && checkoutPostcode.town) || a.city)}"/>

        ${lines.map(l => `<div class="sum-row"><span>${l.qty} × ${esc(title(l))}${l.quantity ? ` <span style="color:var(--muted)">· ${esc(l.quantity)}</span>` : ''}</span><span>${linePrice(l)}</span></div>`).join('')}

async function runCheckoutPostcode(raw) {
  const msg = document.getElementById('pc-msg');
  if (msg) msg.innerHTML = '<span style="color:var(--muted)">Checking…</span>';
  const r = await checkPostcode(raw);
  if (r.error) checkoutPostcode = { postcode: raw, deliverable: false, message: "Couldn't check right now — please try again." };
  else if (!r.valid) checkoutPostcode = { postcode: raw, deliverable: false, message: 'That doesn’t look like a UK postcode.' };
  else checkoutPostcode = { postcode: r.postcode, town: r.town, deliverable: r.deliverable,
    message: deliveryReady() ? `Sorry, ${r.postcode} is outside our delivery area (${areaText()}).` : NOT_READY };
  if (r.valid) store('shop_postcode', r.postcode);
  if (location.hash.startsWith('#/checkout')) render();
}
async function submitOrder() {
  const val = id => document.getElementById(id).value.trim();
  const errBox = document.getElementById('order-err');
  errBox.hidden = true;
  if (!checkoutPostcode || !checkoutPostcode.deliverable) return;
  if (basketBlocker()) { errBox.textContent = basketBlocker() + ' Please check your basket.'; errBox.hidden = false; return; }
  const address = { fullName: val('fullName'), line1: val('line1'), line2: val('line2') || null, city: val('city'), postcode: checkoutPostcode.postcode, phone: val('phone') || null };
  if (!fullAddress(address)) {
    errBox.textContent = 'Please add your full delivery address — name, house number and street, town and postcode.';
    errBox.hidden = false;
    return;
  }
  const btn = document.getElementById('place-btn');
  btn.disabled = true; btn.textContent = 'Saving your address…';
  try {
    // The delivery address is stored on the account before ordering, so it's
    // ready next time on any device.
    await saveAddressToAccount(address);
    store('shop_delivery_address', { ...address, line2: address.line2 || '', phone: address.phone || '' });
    ACCOUNT = { synced: true, hasAddress: true, error: false };
  } catch (err) {
    if (err.needsSignIn) { afterSignIn = '#/checkout'; render(); return; }
    errBox.textContent = 'We couldn’t save your address to your account — please check your connection and try again.';
    errBox.hidden = false;
    btn.disabled = false; btn.textContent = 'Place order';
    return;
  }
  btn.textContent = 'Placing order…';
  try {
    const items = cartLines().map(l => ({ barcode: l.barcode, qty: l.qty, name: l.name, brand: l.brand || null, image: l.image || null, quantity: l.quantity || null }));
    const data = await gql(`mutation PlaceOrder($input: PlaceOrderInput!) { placeOrder(input: $input) { ${ORDER_FIELDS} } }`,
      { input: { items, address, note: val('note') || null, mode: MODE, storeId: STORE_ID } });
    const order = data.placeOrder;
    editingAddress = false;
    CART = {}; store('shop_cart_v2', CART); saveListsSoon(); updateBadges();
    ORDERS_CACHE = [order, ...(ORDERS_CACHE || []).filter(o => o.id !== order.id)];
    location.hash = `#/orders/${order.id}?placed=1`;
  } catch (err) {
    if (err.needsSignIn) { afterSignIn = '#/checkout'; render(); return; }
    errBox.textContent = err.message || 'Something went wrong. Please try again.';
    errBox.hidden = false;
    btn.disabled = false; btn.textContent = 'Place order';
  }
}

// ─── Barcode scanner ─────────────────────────────────────────────
// Uses the browser's built-in BarcodeDetector where it exists (Chrome,
// Android) and the open-source ZXing reader (MIT) elsewhere, e.g. iPhone
// Safari — loaded only when someone actually scans.
const ZXING_SCRIPTS = ['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js',
                       'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js'];
let scanner = null; // { stream, timer, controls }
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const el = document.createElement('script'); el.src = src; el.onload = resolve; el.onerror = reject;
    document.head.appendChild(el);
  });
}
function setScanStatus(text) { const el = document.getElementById('scan-status'); if (el) el.textContent = text; }
function stopScanner() {
  if (!scanner) return;
  clearInterval(scanner.timer);
  if (scanner.controls) try { scanner.controls.stop(); } catch {}
  if (scanner.stream) scanner.stream.getTracks().forEach(t => t.stop());
  scanner = null;
}
function onBarcode(code) {
  const c = String(code || '').replace(/\D/g, '');
  if (!/^\d{8,14}$/.test(c)) return false;
  stopScanner();
  if (navigator.vibrate) navigator.vibrate(60);
  location.hash = '#/product/' + c;
  return true;
}
async function startScanner() {
  stopScanner();
  const video = document.getElementById('scan-video');
  if (!video) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setScanStatus('Camera not available — type the barcode below.'); return; }
  scanner = {};
  try {
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      scanner.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = scanner.stream;
      await video.play();
      setScanStatus('Point the camera at the barcode');
      let busy = false;
      scanner.timer = setInterval(async () => {
        if (busy || !scanner || video.readyState < 2) return;
        busy = true;
        try { const found = await detector.detect(video); for (const b of found) if (onBarcode(b.rawValue)) break; } catch {}
        busy = false;
      }, 200);
    } else {
      setScanStatus('Starting camera…');
      for (const src of ZXING_SCRIPTS) await loadScript(src);
      if (!scanner) return; // left the page while loading
      const reader = new ZXingBrowser.BrowserMultiFormatReader();
      scanner.controls = await reader.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } } }, video, (result) => {
        if (result) onBarcode(result.getText());
      });
      setScanStatus('Point the camera at the barcode');
    }
  } catch (err) {
    stopScanner();
    setScanStatus(err && err.name === 'NotAllowedError'
      ? 'Camera access was blocked — allow it in your browser settings, or type the barcode below.'
      : 'Could not start the camera — type the barcode below.');
  }
}
function viewScan() {
  return `
    <h1>Scan a product</h1>
    <div class="scan-box">
      <video id="scan-video" playsinline muted></video>
      <div class="scan-frame"></div>
      <div class="scan-status" id="scan-status">Starting camera…</div>
    </div>
    <form class="card" style="max-width:480px;margin:0 auto" onsubmit="event.preventDefault();if(!onBarcode(this.code.value)){document.getElementById('code-msg').hidden=false}">
      <label class="f" for="code">Or type the barcode (the numbers under the lines)</label>
      <div class="pc-row" style="margin:0"><input class="f" style="margin:0" id="code" name="code" inputmode="numeric" pattern="[0-9 ]*" placeholder="e.g. 5000157024671" autocomplete="off"/><button class="btn small" type="submit">Find</button></div>
      <div class="field-msg" id="code-msg" hidden style="color:var(--danger);margin-top:6px">Barcodes are 8–14 digits.</div>
    </form>`;
}

// ─── Router ──────────────────────────────────────────────────────
let searchTimer = null;
// Home "Type to search": jump to the search bar at the top and open the keyboard.
function focusSearch() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  const el = document.getElementById('header-q');
  if (el) { el.focus(); el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 1200); }
}
function goSearch(q) { if (q.trim()) location.hash = '#/search?' + new URLSearchParams({ q: q.trim() }); }
function liveSearch(q) { clearTimeout(searchTimer); searchTimer = setTimeout(() => { if (q.trim().length >= 2) goSearch(q); }, 400); }

function render() {
  const [path, query] = (location.hash.slice(1) || '/').split('?');
  const params = new URLSearchParams(query || '');
  const parts = path.split('/').filter(Boolean);
  let html;
  if (!parts.length) html = viewHome();
  else if (parts[0] === 'search') html = viewSearch(params);
  else if (parts[0] === 'product') html = viewProduct(decodeURIComponent(parts[1] || ''));
  else if (parts[0] === 'basket') html = viewBasket();
  else if (parts[0] === 'checkout') html = viewCheckout();
  else if (parts[0] === 'orders' && parts[1]) html = viewOrder(parts[1], params);
  else if (parts[0] === 'orders') html = viewOrders();
  else if (parts[0] === 'signin') html = viewSignIn(params);
  else if (parts[0] === 'store') html = viewStore();
  else if (parts[0] === 'scan') html = viewScan();
  else if (parts[0] === 'account') html = viewAccount(params);
  else html = viewHome();

  const q = document.getElementById('header-q');
  if (document.activeElement !== q) q.value = parts[0] === 'search' ? (params.get('q') || '') : '';

  document.querySelectorAll('[data-nav]').forEach(el => el.classList.toggle('active', el.dataset.nav === (parts[0] || '')));
  // The scan page owns a live camera <video>. Other things finishing loading
  // (settings, Google sign-in, orders) call render() too — redrawing would
  // swap in a fresh, empty <video> while the camera keeps feeding the old one,
  // leaving the page stuck on "Starting camera…". Keep the existing page.
  if (parts[0] === 'scan' && scanner && document.getElementById('scan-video')) return;
  $view.innerHTML = html;
  const g = document.getElementById('gbtn');
  if (g) renderGoogleButton(g);
  if (parts[0] === 'scan') { if (!scanner) startScanner(); } else stopScanner();
}

function setHeaderHeight() { document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px'); }
window.addEventListener('resize', setHeaderHeight);
setHeaderHeight();
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
window.addEventListener('storage', e => { if (e.key === 'shop_cart_v2') { CART = load('shop_cart_v2', {}); updateBadges(); render(); } });
if (SESSION && !signedIn()) { SESSION = null; store('shop_session', null); }
if (signedIn()) { fetchOrders().catch(() => {}); syncStoreWithAccount(); }
updateBadges();
updateAccount();
updateStoreLabel();
loadSettings().then(updateStoreLabel);
render();
initGoogle();
</script>
